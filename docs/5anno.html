<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esperienze 5° Anno · Evan Tronconi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e6edf5; line-height: 1.55; }
        :root {
            --bg-page: #0d1117; --bg-card: #161b22; --bg-elevated: #1a212c;
            --border: #2d3748; --border-light: #3a4559;
            --primary: #e28c3c; --primary-dark: #c2712a; --primary-soft: #f0a55a;
            --primary-glow: rgba(226, 140, 60, 0.12);
            --text: #f0f4fa; --text-muted: #9aaec2;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        .page-header { background: linear-gradient(135deg, #0d1117, #0a0e14); border-bottom: 1px solid var(--border); padding: 2rem 0; }
        .back-link { position: fixed; top: 1.5rem; left: 1.5rem; z-index: 100; background: var(--bg-card); border: 1px solid var(--border); border-radius: 40px; padding: 0.6rem 1.2rem; color: var(--text); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; backdrop-filter: blur(8px); }
        .back-link:hover { border-color: var(--primary); color: var(--primary); transform: translateX(-3px); }
        .header-content { text-align: center; }
        .header-title { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; background: linear-gradient(135deg, #ffffff, var(--primary-soft)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header-subtitle { font-size: 1rem; color: var(--text-muted); }
        
        /* Navigazione anni */
        .year-nav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 0;
            margin-bottom: 1rem;
            position: sticky;
            top: 0;
            z-index: 99;
            backdrop-filter: blur(8px);
        }
        .year-nav-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .year-nav-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.5rem 0;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            width: 120px;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .year-nav-btn:hover {
            background: var(--primary-glow);
            transform: translateX(-3px);
        }
        
        /* Placeholder */
        .placeholder-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            padding: 4rem 0;
        }
        .placeholder-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 500px;
            margin: 0 auto;
        }
        .placeholder-card i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
            display: block;
        }
        .placeholder-card h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .placeholder-card p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        
        footer { border-top: 1px solid var(--border); padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.75rem; margin-top: 2rem; }
        
        @media (max-width: 900px) {
            .header-title { font-size: 1.8rem; }
            .container { padding: 0 1.5rem; }
            .placeholder-card { padding: 2rem 1.5rem; }
            .placeholder-card h2 { font-size: 1.5rem; }
            .year-nav-btn { width: 110px; font-size: 0.75rem; padding: 0.4rem 0; }
        }
    </style>
</head>
<body>

<a href="index.html" class="back-link" id="backLink"><i class="fas fa-arrow-left"></i> Torna alla Home</a>

<header class="page-header">
    <div class="container header-content">
        <h1 class="header-title">Esperienze 5° Anno</h1>
        <p class="header-subtitle">FSL · Formazione Scuola-Lavoro</p>
    </div>
</header>

<div class="year-nav">
    <div class="container year-nav-container">
        <button class="year-nav-btn prev" id="prevYearBtn">← 4° Anno</button>
    </div>
</div>

<main>
    <div class="container">
        <div class="placeholder-section">
            <div class="placeholder-card">
                <i class="fas fa-clock"></i>
                <h2>Prossimamente</h2>
                <p>Il quinto anno è ancora in corso. Le esperienze di FSL verranno aggiunte qui non appena disponibili.</p>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="container">© 2026 Evan Tronconi. Tutti i diritti riservati.</div>
</footer>

<script>
    const prevYearBtn = document.getElementById('prevYearBtn');
    prevYearBtn.addEventListener('click', () => {
        sessionStorage.setItem('scrollPosition', window.scrollY);
        window.location.href = '4anno.html?progetto=polarity';
    });

    const backLink = document.getElementById('backLink');
    backLink.addEventListener('click', (e) => {
        e.preventDefault();
        sessionStorage.setItem('scrollPosition', window.scrollY);
        window.location.href = backLink.getAttribute('href');
    });

    window.addEventListener('load', () => {
        const savedPosition = sessionStorage.getItem('scrollPosition');
        if (savedPosition !== null) {
            window.scrollTo(0, parseInt(savedPosition));
            sessionStorage.removeItem('scrollPosition');
        }
    });
</script>
</body>
</html>
